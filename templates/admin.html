<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333;
            color: #fff; text-align: center; border-radius: 6px; padding: 16px;
            position: fixed; z-index: 101; left: 50%; bottom: 30px;
            opacity: 0; transition: visibility 0s 2.5s, opacity 0.5s linear;
        }
        .toast.show {
            visibility: visible; opacity: 1; transition: opacity 0.5s linear;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading" class="flex justify-center items-center h-screen">
        <p class="text-gray-500">正在驗證管理員身份...</p>
    </div>

    <div id="error-page" class="hidden flex justify-center items-center h-screen">
        <p class="text-red-500 font-bold text-lg">權限不足或初始化失敗</p>
    </div>

    <div id="app" class="hidden container mx-auto p-4 md:p-6">
        <h1 class="text-3xl font-bold mb-6">會員管理儀表板</h1>
        <div class="bg-white shadow-md rounded my-6 overflow-x-auto">
            <table class="min-w-full table-auto text-sm">
                <thead class="bg-gray-200 text-gray-600 uppercase">
                    <tr>
                        <th class="py-3 px-4 text-left">LINE 名稱</th>
                        <th class="py-3 px-4 text-left">管理員暱稱</th>
                        <th class="py-3 px-4 text-left">狀態</th>
                        <th class="py-3 px-4 text-left">會籍到期於</th>
                        <th class="py-3 px-4 text-left min-w-[320px]">權限設定</th>
                        <th class="py-3 px-4 text-left">教練備註</th>
                    </tr>
                </thead>
                <tbody id="user-list-body" class="text-gray-700">
                    <!-- User rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const API_BASE_URL = "https://line-nutrition-bot-dev-db-api.onrender.com";
        let liffId = "2008021259-NLyg2AWl"; // 請確認這是您管理後台專用的 LIFF ID
        let currentAdminId = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        async function updateUser(userId, payload) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Operator-User-Id': currentAdminId
                    },
                    body: JSON.stringify({ userId, ...payload })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '更新失敗');
                }
                const result = await response.json();
                showToast('儲存成功！');
                return result.user;
            } catch (error) {
                console.error('更新失敗:', error);
                showToast(`儲存失敗: ${error.message}`);
                return null;
            }
        }

        function renderUserRow(user) {
            const expiryDate = user.expiry_timestamp ? new Date(user.expiry_timestamp) : null;
            const expiryText = expiryDate ? expiryDate.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '---';
            const displayName = user.display_name || '(尚未同步)';
            const adminNickname = user.admin_nickname || '';

            // ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼ 狀態與顏色判斷邏輯更新 ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
            let statusClass = '';
            let statusText = '';

            if (user.computed_status === 'Active') {
                statusClass = 'bg-green-200 text-green-800';
                statusText = '有效';
            } else if (user.computed_status === 'Expiring') {
                statusClass = 'bg-yellow-200 text-yellow-800'; // 新增黃色
                statusText = '即將到期'; // 新增中文狀態
            } else if (user.computed_status === 'Expired') {
                statusClass = 'bg-red-200 text-red-800';
                statusText = '已過期';
            } else { // Inactive 或其他
                statusClass = 'bg-gray-200 text-gray-800';
                statusText = '未啟用';
            }
            // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ 更新結束 ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

            return `
                <tr id="user-row-${user.user_id}" class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-4">
                        <a href="/liff?targetUserId=${user.user_id}&operatorId=${currentAdminId}" target="_blank" class="text-blue-600 hover:underline" title="點擊以管理員身份查看此會員的日誌">
                            ${displayName}
                        </a>
                    </td>
                    <td class="py-3 px-4">
                        <input type="text" value="${adminNickname}" 
                                onchange="handleNicknameUpdate('${user.user_id}', this.value)"
                                class="w-full border rounded px-2 py-1 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                placeholder="設定暱稱...">
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 font-semibold leading-tight rounded-full text-xs ${statusClass}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-gray-600">${expiryText}</td>
                    <td class="py-3 px-4 space-x-1">
                        <button onclick="handleExpiryUpdate('${user.user_id}', '1h')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600 transition-colors">+1h</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '1d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600 transition-colors">+1d</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '7d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600 transition-colors">+7d</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '28d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600 transition-colors">+28d</button>
                        <input type="datetime-local" onchange="handleExpiryUpdate('${user.user_id}', 'custom', this.value)" class="border rounded px-1 py-0.5 text-xs">
                        <button onclick="handleExpiryUpdate('${user.user_id}', 'clear')" class="bg-gray-500 text-white px-2 py-1 text-xs rounded hover:bg-gray-600 transition-colors">清除</button>
                    </td>
                    <td class="py-3 px-4">
                        <input type="text" value="${user.admin_notes || ''}" 
                                onchange="handleNotesUpdate('${user.user_id}', this.value)"
                                class="w-full border rounded px-2 py-1 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                placeholder="新增備註...">
                    </td>
                </tr>
            `;
        }

        function updateRowUI(userId, updatedUserData) {
             const rowElement = document.getElementById(`user-row-${userId}`);
             if(rowElement) {
                // Merge old data with new data to prevent missing fields
                const oldDisplayName = rowElement.querySelector('a').textContent.trim();
                const mergedUser = {
                    ...updatedUserData,
                    display_name: updatedUserData.display_name || oldDisplayName
                };
                rowElement.outerHTML = renderUserRow(mergedUser);
             }
        }

        async function handleExpiryUpdate(userId, action, customValue = null) {
            const payload = { expiryAction: action };
            if (action === 'custom') {
                if (!customValue) return;
                payload.customExpiry = new Date(customValue).toISOString();
            }
            const updatedUser = await updateUser(userId, payload);
            if (updatedUser) {
                updateRowUI(userId, updatedUser);
            }
        }
        
        async function handleNotesUpdate(userId, notes) {
            const updatedUser = await updateUser(userId, { adminNotes: notes });
            if (updatedUser) updateRowUI(userId, updatedUser);
        }

        async function handleNicknameUpdate(userId, nickname) {
            const updatedUser = await updateUser(userId, { adminNickname: nickname });
            if (updatedUser) updateRowUI(userId, updatedUser);
        }

        async function main() {
            try {
                await liff.init({ liffId });
                if (!liff.isLoggedIn()) {
                    document.getElementById('loading').textContent = '請先登入 LINE 以驗證身份';
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const profile = await liff.getProfile();
                currentAdminId = profile.userId;

                const adminCheckRes = await fetch(`${API_BASE_URL}/api/admin/check?userId=${currentAdminId}`);
                if(!adminCheckRes.ok) throw new Error('管理員身份驗證失敗');
                const { isAdmin } = await adminCheckRes.json();

                if (!isAdmin) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-page').classList.remove('hidden');
                    return;
                }
                
                document.getElementById('loading').textContent = '正在載入會員資料...';

                const usersRes = await fetch(`${API_BASE_URL}/api/admin/users`, {
                    headers: { 'X-Operator-User-Id': currentAdminId }
                });
                if(!usersRes.ok) throw new Error('無法獲取會員列表');
                const users = await usersRes.json();

                const userListBody = document.getElementById('user-list-body');
                userListBody.innerHTML = users.map(renderUserRow).join('');

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

            } catch (error) {
                console.error('初始化或載入失敗:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-page').classList.remove('hidden');
                document.getElementById('error-page').textContent = `發生錯誤: ${error.message}`;
            }
        }

        main();
    </script>
</body>
</html>
