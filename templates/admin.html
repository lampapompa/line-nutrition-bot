<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip { position: relative; display: inline-block; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 120px; background-color: #555; color: #fff;
            text-align: center; border-radius: 6px; padding: 5px 0;
            position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -60px;
            opacity: 0; transition: opacity 0.3s;
        }
        .tooltip .tooltiptext::after {
            content: ""; position: absolute; top: 100%; left: 50%;
            margin-left: -5px; border-width: 5px; border-style: solid;
            border-color: #555 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333;
            color: #fff; text-align: center; border-radius: 2px; padding: 16px;
            position: fixed; z-index: 101; left: 50%; bottom: 30px;
        }
        .toast.show { visibility: visible; -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @-webkit-keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @-webkit-keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading" class="flex justify-center items-center h-screen">
        <p class="text-gray-500">正在驗證管理員身份...</p>
    </div>

    <div id="error-page" class="hidden flex justify-center items-center h-screen">
        <p class="text-red-500">權限不足，您不是管理員。</p>
    </div>

    <div id="app" class="hidden container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">會員管理儀表板</h1>
        <div class="bg-white shadow-md rounded my-6">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="px-4 py-2 text-left">會員名稱</th>
                        <th class="px-4 py-2 text-left">狀態</th>
                        <th class="px-4 py-2 text-left">會籍到期於</th>
                        <th class="px-4 py-2 text-left">權限設定</th>
                        <th class="px-4 py-2 text-left">教練備註</th>
                    </tr>
                </thead>
                <tbody id="user-list-body">
                    </tbody>
            </table>
        </div>
    </div>
    
    <div id="toast" class="toast">儲存成功！</div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const API_BASE_URL = window.location.origin;
        let liffId = "2008021259-NLyg2AWl"; // 請換成您自己的 LIFF ID
        let currentAdminId = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function updateUser(userId, payload) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Operator-User-Id': currentAdminId
                    },
                    body: JSON.stringify({ userId, ...payload })
                });
                if (!response.ok) throw new Error('更新失敗');
                const result = await response.json();
                showToast('儲存成功！');
                return result.user;
            } catch (error) {
                console.error('更新失敗:', error);
                showToast('儲存失敗，請檢查網路');
                return null;
            }
        }

        function renderUserRow(user) {
            const now = new Date();
            const expiryDate = user.expiry_timestamp ? new Date(user.expiry_timestamp) : null;
            const isExpired = expiryDate ? expiryDate < now : true;
            
            const statusClass = user.computed_status === 'Active' ? 'text-green-600' : 'text-red-600';
            const expiryText = expiryDate ? expiryDate.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '---';

            return `
                <tr id="user-row-${user.user_id}" class="border-b">
                    <td class="px-4 py-2">
                        <a href="/liff?targetUserId=${user.user_id}" target="_blank" class="text-blue-600 hover:underline" title="點擊以管理員身份查看此會員的日誌">
                            ${user.display_name || '未命名'}
                        </a>
                    </td>
                    <td class="px-4 py-2 font-semibold ${statusClass}">${user.computed_status}</td>
                    <td class="px-4 py-2 text-sm text-gray-600">${expiryText}</td>
                    <td class="px-4 py-2 space-x-1">
                        <button onclick="handleExpiryUpdate('${user.user_id}', '1h')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600">+1h</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '1d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600">+1d</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '7d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600">+7d</button>
                        <button onclick="handleExpiryUpdate('${user.user_id}', '28d')" class="bg-blue-500 text-white px-2 py-1 text-xs rounded hover:bg-blue-600">+28d</button>
                        <input type="datetime-local" onchange="handleExpiryUpdate('${user.user_id}', 'custom', this.value)" class="border rounded px-1 py-0.5 text-xs">
                        <button onclick="handleExpiryUpdate('${user.user_id}', 'clear')" class="bg-gray-500 text-white px-2 py-1 text-xs rounded hover:bg-gray-600">清除</button>
                    </td>
                    <td class="px-4 py-2">
                        <input type="text" value="${user.admin_notes || ''}" 
                               onchange="handleNotesUpdate('${user.user_id}', this.value)"
                               class="w-full border rounded px-2 py-1 text-sm" 
                               placeholder="新增備註...">
                    </td>
                </tr>
            `;
        }

        function updateRowUI(userId, updatedUserData) {
            const newRowHTML = renderUserRow(updatedUserData);
            const rowElement = document.getElementById(`user-row-${userId}`);
            if (rowElement) {
                rowElement.outerHTML = newRowHTML; // Replace the entire row to re-bind events implicitly
            }
        }

        async function handleExpiryUpdate(userId, action, customValue = null) {
            const payload = { expiryAction: action };
            if (action === 'custom') {
                if (!customValue) return; // Don't do anything if date is cleared
                payload.customExpiry = new Date(customValue).toISOString();
            }
            const updatedUser = await updateUser(userId, payload);
            if (updatedUser) {
                // To get the computed status, we need to fetch all users again or compute on client side
                // For simplicity, re-rendering the row with the direct result
                const now = new Date();
                const expiry = updatedUser.expiry_timestamp ? new Date(updatedUser.expiry_timestamp) : null;
                updatedUser.computed_status = expiry && expiry > now ? 'Active' : 'Expired';
                if(!expiry) updatedUser.computed_status = 'Inactive';
                
                updateRowUI(userId, { ...updatedUser, display_name: document.querySelector(`#user-row-${userId} a`).textContent.trim() });
            }
        }
        
        async function handleNotesUpdate(userId, notes) {
            await updateUser(userId, { adminNotes: notes });
        }

        async function main() {
            try {
                await liff.init({ liffId });
                if (!liff.isLoggedIn()) {
                    document.getElementById('loading').textContent = '請先登入 LINE';
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentAdminId = profile.userId;

                const adminCheckRes = await fetch(`${API_BASE_URL}/api/admin/check?userId=${currentAdminId}`);
                const { isAdmin } = await adminCheckRes.json();

                if (!isAdmin) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-page').classList.remove('hidden');
                    return;
                }
                
                document.getElementById('loading').textContent = '正在載入會員資料...';

                const usersRes = await fetch(`${API_BASE_URL}/api/admin/users`, {
                    headers: { 'X-Operator-User-Id': currentAdminId }
                });
                const users = await usersRes.json();

                const userListBody = document.getElementById('user-list-body');
                userListBody.innerHTML = users.map(renderUserRow).join('');

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

            } catch (error) {
                console.error('初始化或載入失敗:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-page').classList.remove('hidden');
                document.getElementById('error-page').textContent = `發生錯誤: ${error.message}`;
            }
        }

        main();
    </script>
</body>
</html>
