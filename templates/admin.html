<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333;
            color: #fff; text-align: center; border-radius: 6px; padding: 16px;
            position: fixed; z-index: 101; left: 50%; bottom: 30px;
            opacity: 0; transition: visibility 0s 2.5s, opacity 0.5s linear;
        }
        .toast.show {
            visibility: visible; opacity: 1; transition: opacity 0.5s linear;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading" class="flex justify-center items-center h-screen">
        <p class="text-gray-500">正在驗證管理員身份...</p>
    </div>

    <div id="error-page" class="hidden flex justify-center items-center h-screen">
        <p class="text-red-500 font-bold text-lg">權限不足或初始化失敗</p>
    </div>

    <div id="app" class="hidden container mx-auto p-4 md:p-6">
        <h1 class="text-3xl font-bold mb-6">會員管理儀表板</h1>
        <div class="bg-white shadow-md rounded my-6 overflow-x-auto">
            <table class="min-w-full table-auto text-sm">
                <thead class="bg-gray-200 text-gray-600 uppercase">
                    <tr>
                        <th class="py-3 px-4 text-left">LINE 名稱</th>
                        <th class="py-3 px-4 text-left">暱稱</th>
                        <th class="py-3 px-4 text-left">狀態</th>
                        <th class="py-3 px-6 text-left min-w-[480px]">權限設定</th>
                        <th class="py-3 px-4 text-left">備註</th>
                        <th class="py-3 px-4 text-left">操作</th>
                    </tr>
                </thead>
                <tbody id="user-list-body" class="text-gray-700">
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const API_BASE_URL = "https://line-nutrition-bot-dev-db-api.onrender.com";
        let liffId = "2008021259-65mzZK90"; // 這是您管理後台專用的 LIFF ID
        let currentAdminId = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        async function updateUser(userId, payload) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Operator-User-Id': currentAdminId
                    },
                    body: JSON.stringify({ userId, ...payload })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '更新失敗');
                }
                const result = await response.json();
                showToast('儲存成功！');
                return result.user;
            } catch (error) {
                console.error('更新失敗:', error);
                showToast(`儲存失敗: ${error.message}`);
                return null;
            }
        }
        
        function renderUserRow(user) {
            const displayName = user.display_name || '(新用戶)';
            const adminNickname = user.admin_nickname || '';

            const formatForInput = (isoString) => isoString ? isoString.substring(0, 16) : '';
            const startValue = formatForInput(user.membership_start_date);
            const endValue = formatForInput(user.expiry_timestamp);
            const termValue = formatForInput(user.service_termination_date);

            let statusClass = '';
            let statusText = '';
            
            // [MODIFIED] 擴充狀態顯示，對應後端新的所有狀態碼
            switch (user.computed_status) {
                case 'VIP':
                    statusClass = 'bg-yellow-400 text-yellow-900';
                    statusText = 'VIP';
                    break;
                case 'Active':
                    statusClass = 'bg-green-200 text-green-800';
                    statusText = '有效';
                    break;
                case 'Trial':
                    statusClass = 'bg-blue-200 text-blue-800';
                    statusText = '試用';
                    break;
                case 'Reserved': // 原 Attention
                    statusClass = 'bg-cyan-200 text-cyan-800';
                    statusText = '預約';
                    break;
                case 'Abnormal': // 原 Attention
                    statusClass = 'bg-orange-200 text-orange-800';
                    statusText = '異常';
                    break;
                case 'Terminated':
                    statusClass = 'bg-red-200 text-red-800';
                    statusText = '中止';
                    break;
                case 'Expired':
                    statusClass = 'bg-gray-400 text-gray-800';
                    statusText = '已過期';
                    break;
                default:
                    statusClass = 'bg-gray-200 text-gray-800';
                    statusText = '未知';
            }
            
            // [ADDED] 根據 is_vip 狀態決定 VIP 按鈕的文字和樣式
            const isVip = user.is_vip;
            const vipButtonText = isVip ? '取消VIP' : '設為VIP';
            const vipButtonClass = isVip ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-gray-500 hover:bg-gray-600';


            return `
                <tr id="user-row-${user.user_id}" class="border-b border-gray-200 hover:bg-gray-50 align-top">
                    <td class="py-3 px-4 pt-5">
                        <a https://line-nutrition-bot-dev.onrender.com/liff?targetUserId=${user.user_id}&operatorId=${currentAdminId}" target="_blank" class="text-blue-600 hover:underline" title="點擊以管理員身份查看此會員的日誌">
                            ${displayName}
                        </a>
                    </td>
                    <td class="py-3 px-4 pt-5" style="width: 120px;">
                        <input type="text" value="${adminNickname}" 
                               onchange="handleFieldUpdate('${user.user_id}', 'adminNickname', this.value)"
                               class="w-full border rounded px-2 py-1 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                               placeholder="設定暱稱...">
                    </td>
                    <td class="py-3 px-4 pt-5">
                        <span class="px-2 py-1 font-semibold leading-tight rounded-full text-xs ${statusClass}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="py-3 px-6 space-y-2">
                        <div class="flex items-center space-x-2">
                            <label class="text-gray-600 w-20 text-right">會員起日:</label>
                            <input type="datetime-local" value="${startValue}"
                                   onchange="handleDateUpdate('${user.user_id}', 'membershipStartDate', this.value)"
                                   class="border rounded px-1 py-0.5 text-xs w-40" ${isVip ? 'disabled' : ''}>
                            <button onclick="handleDateUpdate('${user.user_id}', 'membershipStartDate', null)" class="text-red-500 hover:text-red-700 text-xs" ${isVip ? 'hidden' : ''}>清除</button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <label class="text-gray-600 w-20 text-right">會員迄日:</label>
                            <input type="datetime-local" value="${endValue}"
                                   onchange="handleDateUpdate('${user.user_id}', 'expiryTimestamp', this.value)"
                                   class="border rounded px-1 py-0.5 text-xs w-40" ${isVip ? 'disabled' : ''}>
                            <button onclick="handleDateUpdate('${user.user_id}', 'expiryTimestamp', null)" class="text-red-500 hover:text-red-700 text-xs" ${isVip ? 'hidden' : ''}>清除</button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <label class="text-gray-600 w-20 text-right">服務終止日:</label>
                            <input type="datetime-local" value="${termValue}"
                                   onchange="handleDateUpdate('${user.user_id}', 'serviceTerminationDate', this.value)"
                                   class="border rounded px-1 py-0.5 text-xs w-40" ${isVip ? 'disabled' : ''}>
                            <button onclick="handleDateUpdate('${user.user_id}', 'serviceTerminationDate', null)" class="text-red-500 hover:text-red-700 text-xs" ${isVip ? 'hidden' : ''}>清除</button>
                        </div>
                        <div class="flex items-center space-x-2 pt-2">
                            <div class="w-20"></div>
                            <button onclick="handleTerminate('${user.user_id}')" class="bg-red-600 text-white px-3 py-1 text-xs rounded hover:bg-red-700 transition-colors">立即終止服務</button>
                        </div>
                    </td>
                    <td class="py-3 px-4 pt-2" style="width: 150px;">
                        <textarea rows="4" 
                                  onchange="handleFieldUpdate('${user.user_id}', 'adminNotes', this.value)"
                                  class="w-full border rounded px-2 py-1 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                  placeholder="新增備註...">${user.admin_notes || ''}</textarea>
                    </td>
                    <td class="py-3 px-4 pt-2 space-y-2">
                        <button onclick="handleSetVip('${user.user_id}', ${!isVip})" class="w-full text-white px-3 py-1 text-xs rounded transition-colors ${vipButtonClass}">${vipButtonText}</button>
                        <button onclick="handleDeleteUser('${user.user_id}', '${displayName}')" class="w-full bg-red-800 text-white px-3 py-1 text-xs rounded hover:bg-red-900 transition-colors">刪除用戶</button>
                    </td>
                </tr>
            `;
        }

        function updateRowUI(userId, updatedUserData) {
             const rowElement = document.getElementById(`user-row-${userId}`);
             if(rowElement) {
                 const oldDisplayName = rowElement.querySelector('a').textContent.trim();
                 const mergedUser = {
                     ...updatedUserData,
                     display_name: updatedUserData.display_name || oldDisplayName
                 };
                 rowElement.outerHTML = renderUserRow(mergedUser);
             }
        }
        
        async function handleFieldUpdate(userId, fieldName, value) {
            const payload = { [fieldName]: value };
            const updatedUser = await updateUser(userId, payload);
            if (updatedUser) updateRowUI(userId, updatedUser);
        }

        async function handleDateUpdate(userId, fieldName, value) {
            if (value === null || value !== undefined) {
                const isoValue = value ? new Date(value).toISOString() : null;
                const payload = { [fieldName]: isoValue };
                const updatedUser = await updateUser(userId, payload);
                if (updatedUser) updateRowUI(userId, updatedUser);
            }
        }
        
        async function handleTerminate(userId) {
            if (confirm(`確定要立即終止這位會員的所有服務嗎？\n此操作無法復原，會員將立即無法登入。`)) {
                const updatedUser = await updateUser(userId, { terminate: true });
                if (updatedUser) updateRowUI(userId, updatedUser);
            }
        }

        // [ADDED] 新增設為 VIP 的處理函式
        async function handleSetVip(userId, setToVip) {
            const actionText = setToVip ? '設為' : '取消';
            const confirmMessage = setToVip 
                ? `確定要將這位會員設為 VIP 嗎？\n他們將擁有不受時間限制的永久權限。`
                : `確定要取消這位會員的 VIP 身份嗎？\n系統將會根據他們原有的日期設定來重新判斷會籍。`;

            if (confirm(confirmMessage)) {
                const updatedUser = await updateUser(userId, { setVip: setToVip });
                if (updatedUser) updateRowUI(userId, updatedUser);
            }
        }

        // [ADDED] 新增刪除用戶的處理函式
        async function handleDeleteUser(userId, displayName) {
            const confirmMessage = `【高風險操作】\n\n您確定要永久刪除用戶「${displayName}」嗎？\n\n此操作會將該用戶的【所有個人檔案、每日日誌、運動設定】從資料庫中徹底移除，且無法復原！\n\n(此功能主要用於清除測試帳號)`;
            
            if (confirm(confirmMessage)) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/admin/user/${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Operator-User-Id': currentAdminId
                        }
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || '刪除失敗');
                    }
                    
                    showToast(`用戶 ${displayName} 已成功刪除！`);
                    // 從畫面上移除該列
                    const rowElement = document.getElementById(`user-row-${userId}`);
                    if (rowElement) {
                        rowElement.remove();
                    }
                } catch (error) {
                    console.error('刪除失敗:', error);
                    showToast(`刪除失敗: ${error.message}`);
                }
            }
        }

        async function main() {
            try {
                await liff.init({ liffId });
                if (!liff.isLoggedIn()) {
                    document.getElementById('loading').textContent = '請先登入 LINE 以驗證身份';
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                const profile = await liff.getProfile();
                currentAdminId = profile.userId;

                const adminCheckRes = await fetch(`${API_BASE_URL}/api/admin/check?userId=${currentAdminId}`);
                if(!adminCheckRes.ok) throw new Error('管理員身份驗證失敗');
                const { isAdmin } = await adminCheckRes.json();

                if (!isAdmin) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-page').classList.remove('hidden');
                    return;
                }
                
                document.getElementById('loading').textContent = '正在載入會員資料...';

                const usersRes = await fetch(`${API_BASE_URL}/api/admin/users`, {
                    headers: { 'X-Operator-User-Id': currentAdminId }
                });
                if(!usersRes.ok) throw new Error('無法獲取會員列表');
                const users = await usersRes.json();

                const userListBody = document.getElementById('user-list-body');
                userListBody.innerHTML = users.map(renderUserRow).join('');

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');

            } catch (error) {
                console.error('初始化或載入失敗:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-page').classList.remove('hidden');
                document.getElementById('error-page').textContent = `發生錯誤: ${error.message}`;
            }
        }

        main();
    </script>
</body>
</html>
