<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 營養教練</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .tab-button.active { border-bottom-color: #10B981; color: #059669; font-weight: 700; }
        input, select, textarea { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { text-align: center; padding: 8px; border-radius: 50%; position: relative; cursor: pointer; }
        .calendar-day.today { background-color: #a7f3d0; }
        .calendar-day.selected { background-color: #10B981; color: white; }
        .calendar-day .completion-dot {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background-color: #fb923c; border-radius: 50%; display: none;
        }
        .calendar-day.completed .completion-dot { display: block; }
        .goal-button { transition: all 0.2s; }
        .goal-button.selected { background-color: #10B981; color: white; border-color: #10B981; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="loading" class="flex justify-center items-center h-screen">
        </div>

    <div id="app" class="hidden max-w-lg mx-auto p-4 space-y-6">
        
        <div class="border-b border-gray-200 sticky top-0 bg-gray-50 z-10">
            <nav class="flex justify-center -mb-px space-x-6" aria-label="Tabs">
                <button onclick="switchTab('profile')" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-gray-500">個人檔案</button>
                <button onclick="switchTab('log')" class="tab-button active whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">每日記錄</button>
                <button onclick="switchTab('trends')" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-gray-500">進度追蹤</button>
            </nav>
        </div>

        <div id="tab-content">
            <div id="profile-tab" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">個人檔案與目標設定</h2>
                    <p id="last-updated" class="text-xs text-gray-400"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">每日飲水目標 (c.c.)</label>
                    <p id="water-suggestion" class="text-xs text-gray-500 mb-1"></p>
                    <input type="number" id="water-goal" class="profile-input mt-1 block w-full border rounded-md py-2 px-3">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-50 p-3 rounded-lg"><p class="text-sm">基礎代謝率 (BMR)</p><p id="bmr-display" class="text-2xl font-bold">---</p></div>
                    <div class="bg-blue-50 p-3 rounded-lg"><p class="text-sm">每日總消耗 (TDEE)</p><p id="tdee-display" class="text-2xl font-bold">---</p></div>
                </div>
                <div>
                    <label class="block text-sm font-medium">設定您的每日目標熱量</label>
                    <div id="goal-options" class="grid grid-cols-3 gap-2 mt-2">
                         <button data-goal-type="maintain" class="goal-button border rounded-md p-2 text-sm">維持體重<span class="block font-bold">---</span></button>
                        <button data-goal-type="mild_loss" class="goal-button border rounded-md p-2 text-sm">溫和減重<span class="block font-bold">---</span></button>
                        <button data-goal-type="loss" class="goal-button border rounded-md p-2 text-sm">積極減重<span class="block font-bold">---</span></button>
                    </div>
                    <input type="hidden" id="target-calories">
                </div>
                <div>
                    <label class="block text-sm font-medium">個人備註</label>
                    <textarea id="personal-notes" class="profile-input mt-1 block w-full border rounded-md py-2 px-3" rows="3" placeholder="例如：對花生過敏、不吃牛肉"></textarea>
                </div>
                <button id="save-profile-button" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg">儲存設定</button>
            </div>

            <div id="log-tab" class="space-y-4">
                <h2 class="text-xl font-bold">每日記錄</h2>
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <p class="text-sm">今日已攝取 / 目標熱量</p>
                    <p class="text-2xl font-bold"><span id="today-calories">0</span> / <span id="log-target-calories">...</span> kcal</p>
                </div>
                <div class="bg-white p-3 rounded-lg shadow-sm">
                    </div>
                <h2 class="text-xl font-bold">飲食與生活記錄</h2>
                <div class="space-y-4" id="daily-log-inputs">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">今日運動</label>
                        <button id="show-exercise-modal" class="text-xs text-emerald-600 hover:underline">熱量消耗參考</button>
                         <div class="flex gap-2">
                            <input data-field="exercise_text" type="text" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md">
                            <input data-field="exercise_kcal" type="number" class="log-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="消耗kcal">
                        </div>
                    </div>
                    </div>
            </div>

            <div id="trends-tab" class="hidden space-y-4">
                 <h2 class="text-xl font-bold">進度追蹤</h2>
                 <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex justify-center gap-2 mb-4">
                        <button onclick="updateChartRange('7days')" class="range-btn bg-emerald-500 text-white px-3 py-1 text-sm rounded-full">最近7天</button>
                        <button onclick="updateChartRange('30days')" class="range-btn bg-gray-200 px-3 py-1 text-sm rounded-full">最近30天</button>
                        <button onclick="updateChartRange('this_month')" class="range-btn bg-gray-200 px-3 py-1 text-sm rounded-full">本月</button>
                    </div>
                    <canvas id="trendsChart"></canvas>
                    <div id="chart-toggles" class="flex flex-wrap justify-center gap-x-4 gap-y-2 mt-4 text-sm">
                        </div>
                 </div>
            </div>
        </div>
    </div>
    
    <div id="exercise-modal" class="modal">
        <div class="modal-content">
            <span id="close-exercise-modal" class="close-btn">&times;</span>
            <h3 class="font-bold text-lg mb-4">常見運動熱量消耗參考</h3>
            <p class="text-sm text-gray-600 mb-2">(以 60 公斤成人，運動 30 分鐘估算)</p>
            <ul class="list-disc list-inside text-sm space-y-1">
                <li>走路 (4 km/h): ≈ 105 kcal</li>
                <li>快走 (6 km/h): ≈ 150 kcal</li>
                <li>慢跑 (8 km/h): ≈ 270 kcal</li>
                <li>瑜珈: ≈ 90 kcal</li>
                <li>基礎重訓: ≈ 120 kcal</li>
            </ul>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // 全域變數
        const API_BASE_URL = "https://line-nutrition-bot-dev-db-api.onrender.com";
        let liffId = "請在這裡貼上您從LINE後台複製的LIFF_ID"; 
        let currentUserId = null, trendsChart = null;
        let currentDate = new Date();
        
        // 主程式
        async function main() {
            try {
                await liff.init({ liffId: liffId });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = await liff.getProfile();
                currentUserId = profile.userId;
                
                await loadProfileData();
                await loadLogDataForDate(currentDate);
                await renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
                setupEventListeners();
                switchTab('log');
            } catch (error) {
                console.error("初始化失敗", error);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            }
        }
        
        // 事件監聽
        function setupEventListeners() {
            // ... (其他事件監聽)
            document.getElementById('show-exercise-modal').addEventListener('click', () => document.getElementById('exercise-modal').style.display = 'block');
            document.getElementById('close-exercise-modal').addEventListener('click', () => document.getElementById('exercise-modal').style.display = 'none');
            window.addEventListener('click', (event) => {
                if (event.target == document.getElementById('exercise-modal')) {
                    document.getElementById('exercise-modal').style.display = "none";
                }
            });
        }
        
        // 個人檔案
        async function saveProfileData() {
            // ... (與上一版幾乎相同，但會多送 waterGoal, personalNotes)
        }

        async function loadProfileData() {
            // ... (與上一版幾乎相同，但會多接收並填入 water_goal, personal_notes, last_updated)
            // 預設選擇溫和減重
            if(!document.querySelector('.goal-button.selected')){
                 document.querySelector('[data-goal-type="mild_loss"]').classList.add('selected');
                 selectGoal({currentTarget: document.querySelector('[data-goal-type="mild_loss"]')});
            }
        }
        
        function updateProfileCalculations() {
            // ... (與上一版幾乎相同，但會新增計算飲水建議)
            const weight = parseFloat(document.getElementById('profile-weight').value);
            if (weight > 0) {
                document.getElementById('water-suggestion').textContent = `根據您的體重，建議飲水量為 ${Math.round(weight * 35)} c.c.`;
            } else {
                document.getElementById('water-suggestion').textContent = '';
            }
        }
        
        // 每日記錄
        async function renderCalendar(year, month) {
            const calendarDays = document.getElementById('calendar-days');
            // ... (與上一版幾乎相同)
            
            // 獲取完成圓點數據
            const response = await fetch(`${API_BASE_URL}/api/completion_dots?userId=${currentUserId}&year=${year}&month=${month + 1}`);
            const daysWithLogs = await response.json();

            calendarDays.querySelectorAll('.calendar-day').forEach(dayEl => {
                const day = parseInt(dayEl.textContent);
                if (daysWithLogs.includes(day)) {
                    dayEl.classList.add('completed');
                }
            });
        }
        
        // 進度追蹤
        async function updateChartRange(range) {
            document.querySelectorAll('.range-btn').forEach(btn => btn.classList.replace('bg-emerald-500', 'bg-gray-200').replace('text-white', 'text-black'));
            event.currentTarget.classList.replace('bg-gray-200', 'bg-emerald-500').replace('text-black', 'text-white');
            await renderChart(range);
        }

        async function renderChart(range = '7days') {
            const chartData = await loadChartData(range);
            // ... (與上一版幾乎相同，但顏色會修改)
            // { label: '運動消耗 (kcal)', data: chartData.exercise, borderColor: '#8B5CF6', ...}
        }

        async function loadChartData(range = '7days') {
            const response = await fetch(`${API_BASE_URL}/api/trends?userId=${currentUserId}&range=${range}`);
            return await response.json();
        }

        // ... (其他函式，例如 switchTab, selectGoal, formatDate 等)

        main();
    </script>
</body>
</html>
