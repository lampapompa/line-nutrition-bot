<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 營養教練</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .tab-button.active { border-bottom-color: #10B981; color: #059669; font-weight: 700; }
        input, select, textarea { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { text-align: center; padding: 8px; border-radius: 50%; position: relative; cursor: pointer; }
        .calendar-day.today { background-color: #a7f3d0; }
        .calendar-day.selected { background-color: #10B981; color: white; }
        .calendar-day .completion-dot {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background-color: #fb923c; border-radius: 50%; display: none;
        }
        .calendar-day.completed .completion-dot { display: block; }
        .goal-button { transition: all 0.2s; }
        .goal-button.selected { background-color: #10B981; color: white; border-color: #10B981; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 25% auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 500px; border-radius: 10px; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .range-btn.active { background-color: #10B981; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="loading" class="flex justify-center items-center h-screen">
        <div class="text-center">
            <svg class="animate-spin h-8 w-8 text-emerald-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-gray-500 mt-2">正在載入資料...</p>
        </div>
    </div>

    <div id="app" class="hidden max-w-lg mx-auto p-4 space-y-6">
        
        <div class="border-b border-gray-200 sticky top-0 bg-gray-50 z-10">
            <nav class="flex justify-center -mb-px space-x-6" aria-label="Tabs">
                <button onclick="switchTab('profile')" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-gray-500">個人檔案</button>
                <button onclick="switchTab('log')" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">每日記錄</button>
                <button onclick="switchTab('trends')" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-gray-500">進度追蹤</button>
            </nav>
        </div>

        <div id="tab-content">
            <div id="profile-tab" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">個人檔案與目標設定</h2>
                    <p id="last-updated" class="text-xs text-gray-400"></p>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">身高 (cm)</label><input type="number" id="height" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3"></div>
                <div><label class="block text-sm font-medium text-gray-700">體重 (kg)</label><input type="number" id="profile-weight" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3"></div>
                <div><label class="block text-sm font-medium text-gray-700">年齡</label><input type="number" id="age" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3"></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">性別</label>
                    <select id="gender" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3"><option value="male">男性</option><option value="female">女性</option></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">活動量</label>
                    <select id="activity-level" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3"><option value="1.2">靜態生活 (久坐 / 少運動)</option><option value="1.55">普通活動 (每週運動3-5天)</option><option value="1.9">動態生活 (高強度運動 / 勞力工作)</option></select>
                </div>
                 <div>
                    <label class="block text-sm font-medium text-gray-700">每日飲水目標 (c.c.)</label>
                    <p id="water-suggestion" class="text-xs text-gray-500 mb-1"></p>
                    <input type="number" id="water-goal" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-50 p-3 rounded-lg"><p class="text-sm">基礎代謝率 (BMR)</p><p id="bmr-display" class="text-2xl font-bold text-emerald-600">---</p></div>
                    <div class="bg-blue-50 p-3 rounded-lg"><p class="text-sm">每日總消耗 (TDEE)</p><p id="tdee-display" class="text-2xl font-bold text-blue-600">---</p></div>
                </div>
                <div>
                    <label class="block text-sm font-medium">設定您的每日目標熱量</label>
                    <div id="goal-options" class="grid grid-cols-3 gap-2 mt-2">
                        <button data-goal-type="maintain" class="goal-button border border-gray-300 rounded-md p-2 text-sm">維持體重<span class="block font-bold">---</span></button>
                        <button data-goal-type="mild_loss" class="goal-button border border-gray-300 rounded-md p-2 text-sm">溫和減重<span class="block font-bold">---</span></button>
                        <button data-goal-type="loss" class="goal-button border border-gray-300 rounded-md p-2 text-sm">積極減重<span class="block font-bold">---</span></button>
                    </div>
                    <input type="hidden" id="target-calories">
                </div>
                <div>
                    <label class="block text-sm font-medium">個人備註</label>
                    <textarea id="personal-notes" class="profile-input mt-1 block w-full border border-gray-300 rounded-md py-2 px-3" rows="3" placeholder="例如：對花生過敏、不吃牛肉"></textarea>
                </div>
                <button id="save-profile-button" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg">儲存設定</button>
            </div>

            <div id="log-tab" class="hidden space-y-4">
                <h2 class="text-xl font-bold">每日記錄</h2>
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <p class="text-sm">今日已攝取 / 目標熱量</p>
                    <p class="text-2xl font-bold text-blue-600"><span id="today-calories">0</span> / <span id="log-target-calories">...</span> kcal</p>
                </div>
                <div class="bg-white p-3 rounded-lg shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <button id="prev-month-btn" class="p-1">&lt;</button>
                        <h3 id="calendar-month-year" class="font-bold text-lg"></h3>
                        <button id="next-month-btn" class="p-1">&gt;</button>
                    </div>
                    <div class="calendar-grid text-sm text-gray-500 mb-2">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="calendar-days" class="calendar-grid"></div>
                </div>
                <h2 class="text-xl font-bold">飲食與生活記錄</h2>
                <div class="space-y-4" id="daily-log-inputs">
                    <div><label class="block text-sm font-medium text-gray-700">早餐</label><div class="flex gap-2"><textarea data-field="breakfast_text" rows="2" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md" placeholder="範例：鮪魚蛋餅"></textarea><input data-field="breakfast_kcal" type="number" class="log-input calorie-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="kcal"></div></div>
                    <div><label class="block text-sm font-medium text-gray-700">午餐</label><div class="flex gap-2"><textarea data-field="lunch_text" rows="2" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md" placeholder="範例：雞腿便當"></textarea><input data-field="lunch_kcal" type="number" class="log-input calorie-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="kcal"></div></div>
                    <div><label class="block text-sm font-medium text-gray-700">晚餐</label><div class="flex gap-2"><textarea data-field="dinner_text" rows="2" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md" placeholder="範例：鮭魚、燙青菜"></textarea><input data-field="dinner_kcal" type="number" class="log-input calorie-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="kcal"></div></div>
                    <div><label class="block text-sm font-medium text-gray-700">點心 / 其他</label><div class="flex gap-2"><textarea data-field="snacks_text" rows="2" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md"></textarea><input data-field="snacks_kcal" type="number" class="log-input calorie-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="kcal"></div></div>
                    <h2 class="text-xl font-bold pt-4">身體數據</h2>
                    <div><label class="block text-sm font-medium text-gray-700">今日飲水 (c.c.)</label><input data-field="water_cc" type="number" class="log-input mt-1 block w-full border-gray-300 rounded-md"></div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">今日運動</label>
                        <button id="show-exercise-modal" class="text-xs text-emerald-600 hover:underline">熱量消耗參考</button>
                         <div class="flex gap-2">
                            <input data-field="exercise_text" type="text" class="log-input mt-1 block w-3/4 border-gray-300 rounded-md" placeholder="範例：跑步 30 分鐘">
                            <input data-field="exercise_kcal" type="number" class="log-input mt-1 block w-1/4 border-gray-300 rounded-md" placeholder="消耗kcal">
                        </div>
                    </div>
                     <div><label class="block text-sm font-medium text-gray-700">今日體重 (kg)</label><input data-field="daily_weight" type="number" class="log-input mt-1 block w-full border-gray-300 rounded-md"></div>
                    <div class="flex items-center gap-4">
                         <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
                            <input data-field="capsule_used" type="checkbox" class="log-input h-5 w-5 rounded border-gray-300 text-emerald-600">
                            <span>使用燃脂膠囊</span>
                        </label>
                        <input data-field="capsule_qty" type="number" class="log-input block w-1/4 border-gray-300 rounded-md" placeholder="數量">
                    </div>
                </div>
            </div>

            <div id="trends-tab" class="hidden space-y-4">
                 <h2 class="text-xl font-bold">進度追蹤</h2>
                 <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex justify-center gap-2 mb-4">
                        <button onclick="updateChartRange('7days')" class="range-btn active bg-emerald-500 text-white px-3 py-1 text-sm rounded-full">最近7天</button>
                        <button onclick="updateChartRange('30days')" class="range-btn bg-gray-200 px-3 py-1 text-sm rounded-full">最近30天</button>
                        <button onclick="updateChartRange('this_month')" class="range-btn bg-gray-200 px-3 py-1 text-sm rounded-full">本月</button>
                    </div>
                    <canvas id="trendsChart"></canvas>
                    <div id="chart-toggles" class="flex flex-wrap justify-center gap-x-4 gap-y-2 mt-4 text-sm">
                        <label class="flex items-center gap-1"><input type="checkbox" class="chart-toggle" data-dataset-index="1" style="accent-color: #ef4444;"> 熱量攝取</label>
                        <label class="flex items-center gap-1"><input type="checkbox" class="chart-toggle" data-dataset-index="2" style="accent-color: #3b82f6;"> 飲水</label>
                        <label class="flex items-center gap-1"><input type="checkbox" class="chart-toggle" data-dataset-index="3" style="accent-color: #8B5CF6;"> 運動消耗</label>
                    </div>
                 </div>
            </div>
        </div>
    </div>
    
    <div id="exercise-modal" class="modal">
        <div class="modal-content">
            <span id="close-exercise-modal" class="close-btn">&times;</span>
            <h3 class="font-bold text-lg mb-4">常見運動熱量消耗參考</h3>
            <p class="text-sm text-gray-600 mb-2">(以 60 公斤成人，運動 30 分鐘估算)</p>
            <ul class="list-disc list-inside text-sm space-y-1">
                <li>走路 (4 km/h): ≈ 105 kcal</li>
                <li>快走 (6 km/h): ≈ 150 kcal</li>
                <li>慢跑 (8 km/h): ≈ 270 kcal</li>
                <li>瑜珈: ≈ 90 kcal</li>
                <li>基礎重訓: ≈ 120 kcal</li>
            </ul>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // --- 1. 全域變數與狀態管理 ---
        const API_BASE_URL = "https://line-nutrition-bot-dev-db-api.onrender.com";
        let liffId = "2008021259-NLyg2AWl"; 
        let currentUserId = null;
        let autosaveTimer = null;
        let trendsChart = null;
        let currentDate = new Date();

        // --- 2. 事件處理與輔助函式 (先定義好所有工具) ---
        const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        function handleLogInputChange() {
            updateCalorieSummary();
            triggerAutosave();
        }

        async function showPrevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            await renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            await loadLogDataForDate(currentDate);
        }

        async function showNextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            await renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            await loadLogDataForDate(currentDate);
        }
        
        async function updateChartRange(range) {
            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-emerald-500', 'text-white');
                btn.classList.add('bg-gray-200');
            });
            event.currentTarget.classList.add('active', 'bg-emerald-500', 'text-white');
            event.currentTarget.classList.remove('bg-gray-200');
            await renderChart(range);
        }
        
        function updateChartVisibility(event) {
            if (!trendsChart) return;
            trendsChart.setDatasetVisibility(event.target.dataset.datasetIndex, event.target.checked);
            trendsChart.update();
        }

        function switchTab(tabName) {
            ['profile', 'log', 'trends'].forEach(tabId => {
                document.getElementById(tabId + '-tab').classList.add('hidden');
                document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.remove('active', 'text-gray-900');
                document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('text-gray-500');
            });
            document.getElementById(tabName + '-tab').classList.remove('hidden');
            const button = document.querySelector(`button[onclick="switchTab('${tabName}')"]`);
            button.classList.add('active', 'text-gray-900');
            button.classList.remove('text-gray-500');

            if (tabName === 'trends') renderChart();
        }

        // --- 3. 主要功能函式 (按照功能分組) ---

        // API CALLS
        async function saveProfileData() {
            if (!currentUserId) return alert("無法取得使用者ID，請重新進入頁面。");
            const profileData = {
                height: document.getElementById('height').value,
                weight: document.getElementById('profile-weight').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                activityLevel: document.getElementById('activity-level').value,
                targetCalories: document.getElementById('target-calories').value,
                waterGoal: document.getElementById('water-goal').value,
                personalNotes: document.getElementById('personal-notes').value,
            };
            try {
                const response = await fetch(`${API_BASE_URL}/api/profile?userId=${currentUserId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: profileData })
                });
                if (!response.ok) throw new Error(`儲存失敗: ${response.statusText}`);
                alert("個人設定已儲存！");
                await loadProfileData();
            } catch (error) {
                console.error("儲存個人檔案失敗:", error);
                alert("儲存個人檔案失敗，請檢查網路連線。");
            }
        }

        async function loadProfileData() {
            if (!currentUserId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/profile?userId=${currentUserId}`);
                if (!response.ok) throw new Error('讀取失敗');
                const data = await response.json();
                
                if (data && Object.keys(data).length > 0) {
                    document.getElementById('height').value = data.height || '';
                    document.getElementById('profile-weight').value = data.profile_weight || '';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('gender').value = data.gender || 'male';
                    document.getElementById('activity-level').value = data.activity_level || 1.55;
                    document.getElementById('target-calories').value = data.target_calories || '';
                    document.getElementById('water-goal').value = data.water_goal || '';
                    document.getElementById('personal-notes').value = data.personal_notes || '';
                    document.getElementById('last-updated').textContent = data.last_updated ? `上次更新: ${data.last_updated}` : '';
                }
                
                updateProfileCalculations();
                
                document.querySelectorAll('.goal-button').forEach(btn => btn.classList.remove('selected'));
                const selectedBtn = Array.from(document.querySelectorAll('.goal-button')).find(btn => btn.dataset.finalKcal == data.target_calories);
                if (selectedBtn) {
                    selectedBtn.classList.add('selected');
                } else if (document.querySelector('[data-goal-type="mild_loss"]').dataset.finalKcal) {
                    const mildLossBtn = document.querySelector('[data-goal-type="mild_loss"]');
                    mildLossBtn.classList.add('selected');
                    selectGoal({currentTarget: mildLossBtn});
                }
            } catch (error) {
                console.error("讀取個人檔案失敗:", error);
            }
        }

        function triggerAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(async () => {
                if (!currentUserId) return;
                const logData = {};
                document.querySelectorAll('#daily-log-inputs [data-field]').forEach(el => {
                    const key = el.dataset.field;
                    const value = el.type === 'checkbox' ? el.checked : (el.value === '' ? null : el.value);
                    logData[key] = value;
                });
                try {
                    const response = await fetch(`${API_BASE_URL}/api/log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUserId, date: formatDate(currentDate), data: logData })
                    });
                    if(response.ok) {
                        const dayEl = document.querySelector(`.calendar-day[data-day='${currentDate.getDate()}']`);
                        if(dayEl) dayEl.classList.add('completed');
                    }
                } catch (error) {
                    console.error(`自動儲存 ${formatDate(currentDate)} 的資料失敗:`, error);
                }
            }, 1500);
        }

        async function loadLogDataForDate(date) {
            document.querySelectorAll('#daily-log-inputs [data-field]').forEach(el => {
                 el.type === 'checkbox' ? el.checked = false : el.value = '';
            });
            updateCalorieSummary();

            if (!currentUserId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/log?userId=${currentUserId}&date=${formatDate(date)}`);
                if (!response.ok) throw new Error('讀取失敗');
                const data = await response.json();
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        const el = document.querySelector(`#daily-log-inputs [data-field="${key}"]`);
                        if (el) {
                            if (el.type === 'checkbox') {
                                el.checked = data[key];
                            } else {
                                el.value = data[key] || '';
                            }
                        }
                    });
                }
            } catch (error) {
                console.error(`讀取 ${formatDate(date)} 的資料失敗:`, error);
            } finally {
                updateCalorieSummary();
            }
        }

        async function loadChartData(range = '7days') {
            if (!currentUserId) return { labels: [], datasets: [] };
            try {
                const response = await fetch(`${API_BASE_URL}/api/trends?userId=${currentUserId}&range=${range}`);
                if (!response.ok) throw new Error('讀取失敗');
                return await response.json();
            } catch (error) {
                console.error("讀取圖表資料失敗:", error);
                return { labels: [], weight: [], calories: [], water: [], exercise: [] };
            }
        }

        // PROFILE TAB LOGIC
        function updateProfileCalculations() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('profile-weight').value);
            const age = parseFloat(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const activityLevel = parseFloat(document.getElementById('activity-level').value);

            if (weight > 0) {
                document.getElementById('water-suggestion').textContent = `依您的體重，建議飲水量為 ${Math.round(weight * 35)} c.c.`;
            } else {
                document.getElementById('water-suggestion').textContent = '';
            }

            const targetCalories = document.getElementById('target-calories').value;
            document.getElementById('log-target-calories').textContent = targetCalories || '...';
            
            if (height > 0 && weight > 0 && age > 0) {
                let bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'male' ? 5 : -161);
                bmr = Math.round(bmr);
                let tdee = Math.round(bmr * activityLevel);
                document.getElementById('bmr-display').textContent = `${bmr} kcal`;
                document.getElementById('tdee-display').textContent = `${tdee} kcal`;
                updateGoalOptions(tdee);
            } else {
                document.getElementById('bmr-display').textContent = '---';
                document.getElementById('tdee-display').textContent = '---';
                updateGoalOptions(null);
            }
        }
        
        function updateGoalOptions(tdee) {
            const [maintainBtn, mildLossBtn, lossBtn] = document.querySelectorAll('.goal-button');
            if (tdee) {
                const maintainKcal = tdee, mildLossKcal = tdee - 300, lossKcal = tdee - 500;
                maintainBtn.querySelector('span').textContent = `${maintainKcal} kcal`;
                mildLossBtn.querySelector('span').textContent = `${mildLossKcal} kcal`;
                lossBtn.querySelector('span').textContent = `${lossKcal} kcal`;
                maintainBtn.dataset.finalKcal = maintainKcal; mildLossBtn.dataset.finalKcal = mildLossKcal; lossBtn.dataset.finalKcal = lossKcal;
            } else {
                [maintainBtn, mildLossBtn, lossBtn].forEach(btn => btn.querySelector('span').textContent = '---');
            }
        }

        function selectGoal(event) {
            document.querySelectorAll('.goal-button').forEach(btn => btn.classList.remove('selected'));
            const selectedButton = event.currentTarget;
            selectedButton.classList.add('selected');
            const finalKcal = selectedButton.dataset.finalKcal;
            if (finalKcal) {
                document.getElementById('target-calories').value = finalKcal;
                document.getElementById('log-target-calories').textContent = finalKcal;
            }
        }

        // LOG TAB LOGIC
        function updateCalorieSummary() {
            let totalKcal = 0;
            document.querySelectorAll('.calorie-input').forEach(input => { totalKcal += parseFloat(input.value) || 0; });
            document.getElementById('today-calories').textContent = totalKcal;
        }

        async function renderCalendar(year, month) {
            const calendarMonthYear = document.getElementById('calendar-month-year');
            const calendarDays = document.getElementById('calendar-days');
            calendarMonthYear.textContent = `${year}年 ${month + 1}月`;
            calendarDays.innerHTML = '';
            
            const response = await fetch(`${API_BASE_URL}/api/completion_dots?userId=${currentUserId}&year=${year}&month=${month + 1}`);
            const daysWithLogs = await response.json();

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDayOfMonth; i++) calendarDays.insertAdjacentHTML('beforeend', '<div></div>');
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.textContent = day;
                dayEl.dataset.day = day;
                dayEl.classList.add('calendar-day');
                if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) dayEl.classList.add('today');
                if (year === currentDate.getFullYear() && month === currentDate.getMonth() && day === currentDate.getDate()) dayEl.classList.add('selected');
                if (daysWithLogs.includes(day)) dayEl.classList.add('completed');
                
                dayEl.insertAdjacentHTML('beforeend', '<div class="completion-dot"></div>');

                dayEl.addEventListener('click', () => {
                    currentDate = new Date(year, month, day);
                    loadLogDataForDate(currentDate).then(() => renderCalendar(year, month));
                });
                calendarDays.appendChild(dayEl);
            }
        }
        
        // TRENDS TAB LOGIC
        async function renderChart(range = '7days') {
            const chartData = await loadChartData(range);
            const ctx = document.getElementById('trendsChart').getContext('2d');
            if (trendsChart) trendsChart.destroy();

            trendsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        { label: '體重 (kg)', data: chartData.weight, borderColor: '#059669', backgroundColor: 'rgba(16, 185, 129, 0.1)', yAxisID: 'yWeight', tension: 0.1, fill: true },
                        { label: '熱量攝取 (kcal)', data: chartData.calories, borderColor: '#ef4444', hidden: true, yAxisID: 'yKcal' },
                        { label: '飲水 (c.c.)', data: chartData.water, borderColor: '#3b82f6', hidden: true, yAxisID: 'yKcal' },
                        { label: '運動消耗 (kcal)', data: chartData.exercise, borderColor: '#8B5CF6', hidden: true, yAxisID: 'yKcal' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        yWeight: { type: 'linear', position: 'left', title: { display: true, text: '公斤 (kg)' } },
                        yKcal: { type: 'linear', position: 'right', title: { display: true, text: 'kcal / c.c.' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
            document.querySelectorAll('.chart-toggle').forEach(el => {
                trendsChart.setDatasetVisibility(el.dataset.datasetIndex, el.checked);
            });
            trendsChart.update();
        }

        // --- 4. 應用程式啟動流程 ---
        async function setupEventListeners() {
            document.querySelectorAll('.profile-input').forEach(el => el.addEventListener('input', updateProfileCalculations));
            document.querySelectorAll('.goal-button').forEach(btn => btn.addEventListener('click', (e) => selectGoal(e)));
            document.getElementById('save-profile-button').addEventListener('click', saveProfileData);
            document.querySelectorAll('.log-input').forEach(el => el.addEventListener('input', handleLogInputChange));
            document.getElementById('prev-month-btn').addEventListener('click', showPrevMonth);
            document.getElementById('next-month-btn').addEventListener('click', showNextMonth);
            document.querySelectorAll('.chart-toggle').forEach(el => el.addEventListener('change', updateChartVisibility));
            document.querySelectorAll('.range-btn').forEach(btn => btn.addEventListener('click', (e) => updateChartRange(e.currentTarget.dataset.range)));
            document.getElementById('show-exercise-modal').addEventListener('click', () => document.getElementById('exercise-modal').style.display = 'block');
            document.getElementById('close-exercise-modal').addEventListener('click', () => document.getElementById('exercise-modal').style.display = 'none');
            window.addEventListener('click', (event) => {
                if (event.target == document.getElementById('exercise-modal')) {
                    document.getElementById('exercise-modal').style.display = "none";
                }
            });
        }
        
        async function main() {
             try {
                document.querySelector('.tab-button[onclick="switchTab(\'log\')"]').classList.add('active','text-gray-900');
                document.getElementById('log-tab').classList.remove('hidden');

                await liff.init({ liffId: liffId });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = await liff.getProfile();
                currentUserId = profile.userId;

                await loadProfileData();
                await loadLogDataForDate(currentDate);
                await renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
                
                setupEventListeners();
            } catch (error) {
                console.error("初始化失敗", error);
                alert("系統初始化失敗，請稍後再試。");
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            }
        }

        // --- 5. 執行主程式 ---
        main();
    </script>
</body>
</html>
